<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cold Start — Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f9f9f9; }
    .pass { color: #2d7a2d; }
    .fail { color: #c0392b; font-weight: bold; }
    h1 { font-size: 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Cold Start — Unit Tests</h1>
  <div id="results"></div>
  <script src="app.js"></script>
  <script>
    const results = document.getElementById('results');
    let passed = 0, failed = 0;

    function test(name, fn) {
      try {
        fn();
        results.innerHTML += `<p class="pass">✓ ${name}</p>`;
        passed++;
      } catch (e) {
        results.innerHTML += `<p class="fail">✗ ${name}: ${e.message}</p>`;
        failed++;
      }
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message || 'Assertion failed');
    }

    function assertEqual(a, b) {
      if (a !== b) throw new Error(`Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
    }

    // ── Storage tests ──────────────────────────────────────────────────────
    test('defaultState returns correct shape', () => {
      const s = defaultState();
      assert(Array.isArray(s.projects), 'projects is array');
      assert(Array.isArray(s.sessions), 'sessions is array');
      assertEqual(s.githubPAT, '');
    });

    test('addProject adds a project with a uuid id', () => {
      const s = addProject(defaultState(), {
        name: 'Test', description: 'Desc', githubUrl: 'https://github.com/a/b'
      });
      assertEqual(s.projects.length, 1);
      assert(s.projects[0].id.length > 10, 'id is a uuid');
      assertEqual(s.projects[0].name, 'Test');
    });

    test('deleteProject removes the correct project', () => {
      let s = defaultState();
      s = addProject(s, { name: 'A', description: '', githubUrl: '' });
      s = addProject(s, { name: 'B', description: '', githubUrl: '' });
      const idA = s.projects[0].id;
      s = deleteProject(s, idA);
      assertEqual(s.projects.length, 1);
      assertEqual(s.projects[0].name, 'B');
    });

    test('updateProject changes only specified fields', () => {
      let s = addProject(defaultState(), { name: 'Old', description: 'D', githubUrl: 'u' });
      s = updateProject(s, s.projects[0].id, { name: 'New' });
      assertEqual(s.projects[0].name, 'New');
      assertEqual(s.projects[0].description, 'D');
    });

    test('saveSession stores session for today', () => {
      const today = new Date().toISOString().slice(0, 10);
      const s = saveSession(defaultState(), { direction: { mainFocus: 'X', tasks: '', smallStep: '' } });
      assertEqual(s.sessions.length, 1);
      assertEqual(s.sessions[0].date, today);
      assertEqual(s.sessions[0].direction.mainFocus, 'X');
    });

    // ── GitHub tests added in Task 4 ──

    results.innerHTML += `<hr><p><strong>${passed} passed, ${failed} failed</strong></p>`;
  </script>
</body>
</html>
