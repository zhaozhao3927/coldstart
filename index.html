<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Start</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="back-btn"     class="back-btn"     aria-label="Go back"        style="display:none" onclick="goBack()">← Back</button>
  <button id="settings-btn" class="settings-btn" aria-label="Open settings" title="Settings">⚙</button>

  <div id="screen-setup"     class="screen"></div>
  <div id="screen-choice"    class="screen"></div>
  <div id="screen-arrive"    class="screen"></div>
  <div id="screen-breathing" class="screen"></div>
  <div id="screen-grounding" class="screen"></div>
  <div id="screen-direction" class="screen"></div>
  <div id="screen-emotion"   class="screen"></div>
  <div id="screen-projects"  class="screen"></div>
  <div id="screen-begin"     class="screen"></div>

  <div id="settings-overlay" class="overlay hidden"></div>

  <script src="app.js"></script>
</body>
</html>
